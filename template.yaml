AWSTemplateFormatVersion: '2010-09-09'
Description: Test and Production CloudFormation Pipeline

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - test
      - production

Resources:
  DemoQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  QueueURL:
    Description: URL of the created SQS queue
    Value: !Ref DemoQueue
