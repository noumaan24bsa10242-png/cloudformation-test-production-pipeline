```yaml
AWSTemplateFormatVersion: '2010-09-09'
Description: Test and Production CloudFormation Pipeline

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - test
      - production
    Description: Choose test or production environment

Resources:
  DemoQueue:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  QueueURL:
    Description: URL of the created SQS queue
    Value: !Ref DemoQueue

  QueueName:
    Description: Name of the created SQS queue
    Value: !GetAtt DemoQueue.QueueName
```
